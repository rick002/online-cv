    time: 2007 - 2011

experiences:
  - role: Ingeniero IV · Ingeniero de Integración Empresarial
    time: Ene 2024 – Presente
    company: Claro, Santo Domingo
    details: |
      • Implementé una **capa de integración para consultas de metadatos** utilizada por todos los sistemas de cara al cliente a nivel nacional, 
        garantizando una única fuente de verdad y reduciendo inconsistencias de datos en toda la infraestructura de negocio.

      • Construí una **capa de integración para consultas de órdenes de trabajo en campo**, habilitando acceso casi en tiempo real a los sistemas operativos 
        y mejorando la eficiencia en la entrega de servicios.

      • Diseñé y desplegué un **servicio de dominio REST API** para recuperar interacciones de clientes a través de canales digitales, 
        mejorando el seguimiento, la generación de reportes y el análisis de engagement.

      • Integré con **SAP** para la provisión de equipos y servicios (códigos CPE), optimizando operaciones y reduciendo errores manuales.

      • Desarrollé una integración con **servicios SOAP** para órdenes de provisión de líneas fijas, asegurando continuidad del negocio 
        y una transición más fluida entre plataformas heredadas y modernas.

      • Entregué un **servicio compuesto** para la activación de códigos de restricción de llamadas, gestionando todo el ciclo de vida desde el desarrollo 
        hasta el despliegue con Kubernetes, Docker y GitLab CI, logrando mayor estabilidad y despliegues más rápidos.

      • Preparé una **prueba de concepto de una API de comunicaciones multicanal**, permitiendo el envío de mensajes a través de distintos canales 
        con extensibilidad plug-and-play para incorporar nuevos canales sin impactar las integraciones existentes.

      • Expuse **APIs externas de forma segura mediante Apigee Gateway**, habilitando configuraciones de proxies controlados que mejoraron 
        la gobernanza y minimizaron riesgos de acceso no controlado.

      • Stack: Java, Quarkus, Spring Boot, Maven, Apache Camel, Kafka, Bases de Datos SQL, Kubernetes, Docker, GitLab CI, 
        OpenAPI/Swagger, SOAP, Apigee, SAP.

  - role: Diseñador de Software Senior
    time: Mar 2024 – Ago 2024
    company: FalconTech SRL
    details: |
      • Entregué una **aplicación de creación de contenido para Twitter asistida por IA** de extremo a extremo (UI/UX, frontend, backend, BD, despliegue).

      • Creé una **plataforma REST API** para estadísticas financieras (datos del Banco Central) y licitaciones públicas en la República Dominicana; 
        asumiendo UI/UX, frontend, backend, BD y despliegue.

  - role: Desarrollador Senior .NET
    time: 2023 - 2024
    company: Claro, Santo Domingo
    details: |
      • Integré **servicios de migración eSIM** (prepago/postpago) y un plugin para la creación automática de casos en fallos de provisión móvil.

      • Implementé una **búsqueda de productos** con sugerencias basadas en antigüedad (últimos 6 meses).

      • Stack: .NET/C#, NopCommerce, HTML/CSS, Knockout.js, React, MVC, RDBMS.

  - role: Desarrollador Senior Java
    time: 2022
    company: Claro, Remoto
    details: |
      • Amplié la funcionalidad de los módulos de **suspensión postpago**, gestión de ventas y consola de administración.

      • Construí una integración con **FlyTXT Neon** para recuperar ofertas de clientes en campañas de marketing entrante y saliente.

      • Stack: Java, JSF, SOAP, Maven, REST, RDBMS.

  - role: Desarrollador de Software I
    time: 2021 - 2023
    company: Korewireless, Remoto
    details: |
      • Estandaricé características de productos de múltiples telcos en un **pipeline de transformación unificado**.

      • Desplegué un **HPA en Kubernetes** basado en métricas de Kafka Consumer Lag para escalar automáticamente pods de clúster según tráfico.

      • Migré servicios del motor de reglas de **.NET Core 3.1 → .NET 6**.

      • Stack: .NET/C#, Kafka, Kubernetes, Node.js, Angular, GraphQL, OpenAPI, SQL.

  - role: Consultor Independiente
    time: 2021 - Presente
    company: Independiente
    details: |
      • Aplicación de programación de redes sociales (IA) para creación de contenido en Twitter.

      • API RESTful para **envío masivo de mensajes** a través de WhatsApp Business.

      • Varias **landing pages** (ONGs, seguridad, equipos médicos, call center, branding personal).

      • Stack: Node.js, NestJS, Angular, MongoDB, SQL.

  - role: Desarrollador Angular
    time: 2020 - 2021
    company: Call Center Pros, Santo Domingo
    details: |
      • Definí arquitectura y lideré la **migración de UI** para CRM Laczy y portal de empleos Jobs.

      • Stack: Angular, TypeScript, RxJS, REST.

  - role: Desarrollador de Software II
    time: 2020
    company: Verizon Enterprise, Remoto
    details: |
      • Migré la suite de **herramientas de administración** y los módulos de **mantenimiento BAN** para clientes corporativos.

      • Stack: Angular, TypeScript, RxJS, PrimeNG.

  - role: Desarrollador Java
    time: 2019 - 2020
    company: Claro, Santo Domingo
    details: |
      • Rediseñé **Digital Forms**, una aplicación web compuesta utilizada a nivel nacional en centros de servicio.

      • Integré transacciones de 5 sistemas → mapeadas en formularios digitales → enviadas al cliente en **PDF por email**.

      • Modele UML, apliqué patrones de diseño OO; reduje tiempos de implementación **de 1 semana a 1 hora**.

      • Stack: Java, Wicket, Maven, JDBC, Spring DI, HTML/CSS.

