career-profile:
  title: Transformando la Tecnología en Valor de Negocio
  summary: |
    Ingeniero de Software Senior especializado en **plataformas de integración y APIs** para entornos de telecomunicaciones y empresariales. 

    Traduzco objetivos de negocio en servicios robustos (Quarkus/Spring, Camel, Kafka, Apigee) que estandarizan datos, 
    reducen la fricción operativa y aceleran la entrega. 

    He liderado soluciones de extremo a extremo—desde UI/UX hasta backend y despliegue—priorizando la confiabilidad, 
    mantenibilidad e impacto de negocio medible.

