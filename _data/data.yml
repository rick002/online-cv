career-profile:
  title: Bridging Telecom Systems through Integration & APIs
  summary: |
    Senior Software Engineer specialized in **telecom-grade integration platforms (BSS/OSS)** and **API-driven ecosystems**.  
    Experienced collaborating with **telecom operators, vendors, and enterprise clients** across the Americas.  

    My work connects systems like **Netcracker, Ericsson, and Amdocs** to core business processes—enabling provisioning, 
    service activation, and customer lifecycle automation.  

    I combine backend mastery (Quarkus, Camel, Kafka, Apigee) with strategic understanding of **telecom operations**, 
    ensuring integrations translate directly into business value.  

    Author of two newsletters with 900+ readers across LATAM and Spain:  
    • **Landing Crazy POP** (conversion & digital storytelling).  
    • **Lectura Ligera** (APIs & business strategy).

achieve-goals:
  title: Achieve Goals
  summary: |
    My next chapter is about **expanding integration excellence in telecom** — driving synergy between business systems, 
    APIs, and customer experience platforms.  

    I aim to help telecom operators and enterprises modernize their **BSS/OSS stacks**, enabling faster time-to-market, 
    more resilient services, and transparent digital ecosystems.  

    Long-term, I aspire to become a **telecom solutions architect**, leading cross-domain integrations that 
    balance reliability, scalability, and business impact.

experiences:
  title: Experiences
  roles:
    - role: Engineer IV · Enterprise Integration Engineer
      time: Jan 2024 – Present
      company: Claro, Santo Domingo
      details: |
        • Designed and delivered integrations connecting **BSS/OSS systems (Netcracker, Ericsson)** with internal 
          customer-care and provisioning layers to ensure unified service orchestration.

        • Built **metadata and operational query services** used by multiple front-office systems, standardizing 
          data retrieval across CRM, billing, and order management domains.

        • Integrated with **SAP and legacy fixed-line OSS** for provisioning workflows, automating end-to-end activation.

        • Delivered **REST APIs** for customer interaction tracking, enhancing reporting and omnichannel engagement.

        • Developed a **composite API** for call restriction and service feature activation, deployed via Kubernetes, 
          with CI/CD in GitLab and governance through Apigee Gateway.

        • Partnered with technical and business stakeholders to align integrations with regulatory and operational KPIs.

        • Stack: Java, Quarkus, Spring Boot, Apache Camel, Kafka, SOAP, Apigee, SAP, Docker, Kubernetes, GitLab CI.

    - role: Senior Software Designer
      time: Mar 2024 – Aug 2024
      company: FalconTech SRL
      details: |
        • Led design and delivery of **AI-assisted SaaS solutions** with a strong focus on user experience and 
          creative interface design.

        • Acted as technical lead for financial data and analytics APIs in the Dominican Republic public sector.

        • Promoted modern UI/UX standards, responsive design, and design system consistency across products.

    - role: Senior .NET Developer
      time: 2023 - 2024
      company: Claro, Santo Domingo
      details: |
        • Developed and integrated **eSIM provisioning workflows** connected with **Ericsson provisioning gateways** 
          and internal CRM/BSS services for prepaid and postpaid migrations.

        • Automated **case management creation** for failed activation scenarios via API triggers.

        • Technologies: .NET/C#, NopCommerce, React, MVC, SQL Server, Ericsson APIs.

    - role: Senior Java Developer
      time: 2022
      company: Claro, Remote
      details: |
        • Integrated with **FlyTXT Neon (Amdocs)** for campaign and offer management.  

        • Enhanced **postpaid suspension and provisioning modules**, improving data sync between BSS and 
          external marketing systems.

        • Collaborated with customer experience teams to align backend flows with operational KPIs.

        • Stack: Java, JSF, SOAP, Maven, REST.

    - role: Software Developer I
      time: 2021 - 2023
      company: Korewireless, Remote
      details: |
        • Connected **multi-carrier BSS stacks** (AT&T, Verizon, T-Mobile, Orange) to a unified IoT SaaS platform, 
          standardizing event flows and product features across regions.

        • Migrated core **Rules Engine** (.NET Core 3.1 → .NET 6) handling SIM provisioning logic across carriers.

        • Implemented **Kafka-based auto-scaling (HPA)** in Kubernetes, adjusting resources by consumer lag metrics.

        • Collaborated with product and ops teams to ensure SLA adherence and provisioning stability.

        • Stack: .NET/C#, Kafka, Kubernetes, Node.js, Angular, GraphQL, SQL.

    - role: Software Developer II
      time: 2020
      company: Verizon Enterprise, Remote
      details: |
        • Migrated **BAN maintenance and admin tools** for enterprise clients, ensuring seamless integration 
          between customer data systems and internal BSS interfaces.

        • Supported interoperation between Verizon’s CRM and third-party billing/OSS layers.

        • Stack: Angular, TypeScript, PrimeNG, REST APIs.

    - role: Independent Consultant
      time: 2021 - Present
      company: Independent
      details: |
        • Led SaaS and web development projects with emphasis on **architecture, usability, and branding**.

        • Created REST APIs for messaging, automation, and analytics platforms.

        • Directed end-to-end delivery for **marketing and data-driven applications**.

        • Stack: Node.js, NestJS, Angular, MongoDB, SQL.

    - role: Angular Developer
      time: 2020 - 2021
      company: Call Center Pros, Santo Domingo
      details: |
        • Defined architecture and led **UI modernization** for CRM and job portal systems.

        • Mentored junior developers in component-based design and UX consistency.

        • Stack: Angular, TypeScript, RxJS, REST.

    - role: Java Developer
      time: 2019 - 2020
      company: Claro, Santo Domingo
      details: |
        • Rebuilt **Digital Forms platform**, centralizing customer documentation across multiple BSS systems.

        • Reduced implementation time from one week to one hour through automated mapping and integration patterns.

        • Stack: Java, Wicket, Maven, Spring DI, JDBC.

