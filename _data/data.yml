career-profile:
  title: Meet My Career Profile
  summary: |
    Senior Software Engineer focused on **integration platforms and APIs** for telecom and enterprise environments. 
    I translate business goals into robust services (Quarkus/Spring, Camel, Kafka, Apigee) that standardize data, 
    reduce operational friction, and accelerate delivery. I’ve led end-to-end solutions—from UI/UX to backend and 
    deployment—prioritizing reliability, maintainability, and measurable business impact.

