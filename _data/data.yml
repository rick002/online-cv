experiences:
  - role: Engineer IV · Integrations Engineer
    time: 2024 - present
    company: Claro, Santo Domingo
    details: |
      • Implemented a **metadata query integration layer** used by all customer-facing systems nationwide, 
        unifying formats and simplifying downstream consumption.
      • Built an **integration for field work-order queries**, enabling near real-time visibility across 
        operational systems and improving service delivery.
      • Stack: Java, Quarkus, Spring Boot, Maven, Apache Camel, Kafka, SQL, Kubernetes, OpenAPI/Swagger, SOAP, Apigee.

  - role: Senior Software Designer
    time: Mar 2024 – Aug 2024
    company: FalconTech SRL
    details: |
      • Delivered an **AI-assisted Twitter content app** end-to-end (UI/UX, frontend, backend, DB, deploy).
      • Created a **REST API platform** for financial statistics (Central Bank data) and public tenders in the DR; 
        owned UI/UX, frontend, backend, DB, and deployment.

  - role: Senior .NET Developer
    time: 2023 - 2024
    company: Claro, Santo Domingo
    details: |
      • Integrated **eSIM migration services** (prepaid/postpaid) and automated case creation for failed mobile provisioning.
      • Implemented a **product search** with recency-based suggestions (last 6 months).
      • Stack: .NET/C#, NopCommerce, HTML/CSS, Knockout.js, React, MVC, RDBMS.

  - role: Senior Java Developer
    time: 2022
    company: Claro, Remote
    details: |
      • Extended **postpaid suspension**, sales management and admin console modules.
      • Built integration with **FlyTXT Neon** to retrieve client offers for inbound/outbound campaigns.
      • Stack: Java, JSF, SOAP, Maven, REST, RDBMS.

  - role: Software Developer I
    time: 2021 - 2023
    company: Korewireless, Remote
    details: |
      • Standardized multi-telco product features into a **unified transformation pipeline**.
      • Deployed **K8s HPA** driven by Kafka consumer lag for auto-scaling based on traffic.
      • Migrated Rules Engine services from **.NET Core 3.1 → .NET 6**.
      • Stack: .NET/C#, Kafka, Kubernetes, Node.js, Angular, GraphQL, OpenAPI, SQL.

  - role: Independent Consultant
    time: 2021 - present
    company: Independent
    details: |
      • Social media scheduling app (AI-assisted) for Twitter content creation.
      • RESTful API for **batch WhatsApp Business** messaging.
      • Multiple **landing pages** (non-profits, security, medical equipment, call center, personal branding).
      • Stack: Node.js, NestJS, Angular, MongoDB, SQL.

  - role: React Native Developer
    time: 2021
    company: Observe, Remote
    details: |
      • Prototyped core screens for e-learning mobile app (React Native/Expo/Firebase).

  - role: Angular Developer
    time: 2020 - 2021
    company: Call Center Pros, Santo Domingo
    details: |
      • Defined architecture and led **UI migration** for Laczy CRM and Jobs portal.
      • Stack: Angular, TypeScript, RxJS, REST.

  - role: Software Developer II
    time: 2020
    company: Verizon Enterprise, Remote
    details: |
      • Migrated **Administration Tool** suite and **BAN maintenance** modules for carrier clients.
      • Stack: Angular, TypeScript, RxJS, PrimeNG.

  - role: Java Developer
    time: 2019 - 2020
    company: Claro, Santo Domingo
    details: |
      • Redesigned **Digital Forms**, a composite web app used nationwide in service centers.
      • Aggregated transactions from 5 systems → mapped to digital forms → **PDF via email** to customers.
      • Modeled UML, applied OO patterns; reduced implementation time **from 1 week to 1 hour**.
      • Stack: Java, Wicket, Maven, JDBC, Spring DI, HTML/CSS.

