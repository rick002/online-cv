experiences:
  title: Experiencia
  roles:
    - role: Engineer IV · Ingeniero de Integración Empresarial
      time: Ene 2024 – Presente
      company: Claro, Santo Domingo
      details: |
        • Implementé una **capa de integración de consultas de metadatos** utilizada por todos los sistemas de cara al cliente a nivel nacional, 
          garantizando una única fuente de verdad y reduciendo inconsistencias de datos en toda la infraestructura de negocio.

        • Construí una **capa de integración para consultas de órdenes de trabajo de campo**, habilitando acceso casi en tiempo real 
          a sistemas operativos y mejorando la eficiencia en la entrega de servicios.

        • Diseñé y desplegué un **servicio de dominio REST API** para recuperar interacciones de clientes en canales digitales, 
          mejorando el seguimiento, reportes y análisis de engagement.

        • Integré con **SAP** para la provisión de equipos/servicios CPE, agilizando operaciones y reduciendo errores manuales.

        • Desarrollé una integración con **servicios SOAP** para órdenes de provisión de líneas fijas, asegurando continuidad del negocio 
          y una transición fluida entre plataformas legacy y modernas.

        • Entregué un **servicio compuesto** para la activación de códigos de restricción de llamadas, gestionando el ciclo de vida completo 
          desde el desarrollo hasta el despliegue con Kubernetes, Docker y GitLab CI, logrando mayor estabilidad y despliegues más rápidos.

        • Preparé un **POC para una API de comunicaciones multicanal**, habilitando mensajería a través de múltiples canales con extensibilidad plug-and-play 
          para incorporar nuevos canales sin afectar las integraciones existentes.

        • Expuse **APIs externas de manera segura a través de Apigee Gateway**, permitiendo configuraciones de proxy controladas para mejorar 
          la gobernanza y minimizar riesgos de acceso.

        • Stack: Java, Quarkus, Spring Boot, Maven, Apache Camel, Kafka, SQL Databases, Kubernetes, Docker, GitLab CI, 
          OpenAPI/Swagger, SOAP, Apigee, SAP.

    - role: Senior Software Designer
      time: Mar 2024 – Ago 2024
      company: FalconTech SRL
      details: |
        • Entregué una aplicación de **contenido para Twitter asistida por IA** end-to-end (UI/UX, frontend, backend, DB, deploy).

        • Creé una **plataforma REST API** para estadísticas financieras (datos del Banco Central) y licitaciones públicas en la RD; 
          lideré UI/UX, frontend, backend, DB y despliegue.

    - role: Senior .NET Developer
      time: 2023 - 2024
      company: Claro, Santo Domingo
      details: |
        • Integré **servicios de migración eSIM** (prepago/postpago) y creación automática de casos para provisiones fallidas.

        • Implementé una **búsqueda de productos** con sugerencias basadas en recencia (últimos 6 meses).

        • Stack: .NET/C#, NopCommerce, HTML/CSS, Knockout.js, React, MVC, RDBMS.

    - role: Senior Java Developer
      time: 2022
      company: Claro, Remoto
      details: |
        • Extendí módulos de **suspensión postpago**, gestión de ventas y consola administrativa.

        • Construí integración con **FlyTXT Neon** para recuperar ofertas de clientes en campañas inbound/outbound.

        • Stack: Java, JSF, SOAP, Maven, REST, RDBMS.

    - role: Software Developer I
      time: 2021 - 2023
      company: Korewireless, Remoto
      details: |
        • Estandaricé características de productos multi-telco en un **pipeline de transformación unificado**.

        • Desplegué **K8s HPA** impulsado por lag de consumidores Kafka para autoescalado basado en tráfico.

        • Migré servicios del Rules Engine de **.NET Core 3.1 → .NET 6**.

        • Stack: .NET/C#, Kafka, Kubernetes, Node.js, Angular, GraphQL, OpenAPI, SQL.

    - role: Consultor Independiente
      time: 2021 - Presente
      company: Independiente
      details: |
        • Aplicación de programación de publicaciones en redes sociales (asistida por IA) para creación de contenido en Twitter.

        • API RESTful para **mensajería masiva en WhatsApp Business**.

        • Varias **landing pages** (ONGs, seguridad, equipos médicos, call center, marca personal).

        • Stack: Node.js, NestJS, Angular, MongoDB, SQL.

    - role: Angular Developer
      time: 2020 - 2021
      company: Call Center Pros, Santo Domingo
      details: |
        • Definí arquitectura y lideré la **migración UI** para el CRM Laczy y portal de empleos.

        • Stack: Angular, TypeScript, RxJS, REST.

    - role: Software Developer II
      time: 2020 - 2020
      company: Verizon Enterprise, Remoto
      details: |
        • Migré el **suite de herramientas de Administración** y módulos de mantenimiento BAN para clientes carrier.

        • Stack: Angular, TypeScript, RxJS, PrimeNG.

    - role: Java Developer
      time: 2019 - 2020
      company: Claro, Santo Domingo
      details: |
        • Rediseñé **Formularios Digitales**, una aplicación compuesta usada a nivel nacional en centros de servicio.

        • Agregué transacciones de 5 sistemas → mapeadas a formularios digitales → **PDF vía email** a clientes.

        • Modele UML, apliqué patrones OO; reduje tiempo de implementación **de 1 semana a 1 hora**.

        • Stack: Java, Wicket, Maven, JDBC, Spring DI, HTML/CSS.

