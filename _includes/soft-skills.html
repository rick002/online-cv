{% assign skills = site.data.data.sidebar.soft-skills %} {% if skills %}
<div class="interests-container container-block">
  <h2 class="container-block-title">{{ skills.title }}</h2>

  <ul class="list-unstyled interests-list">
    {% for item in skills.items %} {% if item.link %}
    <li><a href="#">{{ item }}</a></li>
    {% else %}
    <li>{{ item }}</li>
    {% endif %} {% endfor %}
  </ul>
</div>
{% endif %}
