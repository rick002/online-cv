{% assign interests = site.data.data.sidebar.interests %} {% if interests %}
<div class="interests-container container-block">
  <h2 class="container-block-title">{{ interests.title }}</h2>

  <ul class="list-unstyled interests-list">
    {% for item in interests.items %} {% if interests.link %}
    <li><a href="#">{{ item }}</a></li>
    {% else %}
    <li>{{ item }}</li>
    {% endif %} {% endfor %}
  </ul>
</div>
<!--//interests-->
{% endif %}
